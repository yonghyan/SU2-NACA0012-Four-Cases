% 4_NACA0012_SinWind
SOLVER= EULER
% Standardized NACA0012 comparison; SU2 v8.5.0
% Shared free stream: M=0.2, AOA=0 deg, T=288.15 K, gamma=1.4, R=287.058.
% Shared pressure is the Sutherland-air value corresponding to Re=1000,
% chord 1 m and U_inf=68.0594057512 m/s. For viscous cases SU2's
% REYNOLDS initialization recomputes this pressure from Re.

MATH_PROBLEM= DIRECT
RESTART_SOL= NO
MACH_NUMBER= 0.2
AOA= 0.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 21.74616663212408
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
REF_DIMENSIONALIZATION= DIMENSIONAL
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
% Unsteady fixed inviscid airfoil with a vertical sine gust.
MARKER_EULER= ( airfoil )
% Matched physical time interval and inner-iteration limit.
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 0.0023555025613149587
TIME_ITER= 250
MAX_TIME= 0.5888756403287397
INNER_ITER= 50
GRID_MOVEMENT= GUST
MACH_MOTION= 0.2
WIND_GUST= YES
GUST_TYPE= SINE
GUST_DIR= Y_DIR
GUST_WAVELENGTH= 25.0
GUST_PERIODS= 1.0
GUST_AMPL= 2.37668682
GUST_BEGIN_TIME= 0.0
GUST_BEGIN_LOC= -25.0
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% Identical numerical settings wherever the governing equations permit.
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 1.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-1
LINEAR_SOLVER_ITER= 3
MGLEVEL= 3
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= ( 4, 4, 4, 4 )
MG_POST_SMOOTH= ( 4, 4, 4, 4 )
MG_CORRECTION_SMOOTH= ( 1, 1, 1, 1 )
MG_DAMP_RESTRICTION= 0.5
MG_DAMP_PROLONGATION= 0.5
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.0001
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% New output prefixes preserve results from the previous configurations.
MESH_FILENAME= ../mesh_NACA0012_common.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history_unified
RESTART_FILENAME= restart_flow_unified
VOLUME_FILENAME= flow_unified
SURFACE_FILENAME= surface_flow_unified
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= 10
